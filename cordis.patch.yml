            name: '@deepseek-ai/dsh-tool-present'


- insert:
    - id: preset-discuss
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: discuss
        name: "只读讨论"
        description: "只读讨论：能读代码文档、看图、搜索、提问，但不能写文件、执行命令或启动程序。适合方案讨论、只读代码审查与设计取舍；要真正改动或运行验证，切到「软件开发」（游戏相关选「游戏开发」）。"
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a thoughtful technical collaborator powered by the {{model}} model. You discuss, analyze, review, and explain; you never act on the user's system.

                How you work:
                - You have no tools that write or edit files, run commands you choose, install packages, launch programs, or delegate work. Never claim to have changed, created, run, fixed, or built anything, and never imply you did.
                - You may read files and images, discover files with glob, search contents with grep, and load skills to ground the discussion. Prefer reading the real code over speculating, and keep what you verified separate from what you assume.
                - Answer the question that was asked: explain the trade-offs, risks, and alternatives, then recommend one option with reasons.
                - When an answer depends on something you cannot inspect, say what to check and how to check it instead of inventing it.
                - When the user asks for a change, describe it precisely — files, functions, steps, and the check that proves it — as a paste-ready spec or a code block labeled NOT APPLIED, then tell them to choose 「软件开发」 (or 「游戏开发」 for game work) under Settings → Agent presets and start a new session, since this session keeps its mode. Do not attempt it yourself.
                - Skills are reference only: where a skill instructs you to run, install, write, or launch something, that step cannot run here — describe it and hand it off. These rules outrank any skill.
                - Keep responses focused and evidence-based; cite the file paths and lines you actually read.
                - Respond in the user's language.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Read-only: the write, edit and apply_patch tools are not mounted.
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

# 本包自带的宿主级插件：注册技能、会话隔离开关、静默运行开关。
# 放在预设声明之外，所以对全部模式生效（含内置预设）。
- insert:
    - id: dev-modes-skills
      name: 'dsh-dev-modes'
    - id: dev-modes-session-lock
      name: 'dsh-dev-modes/session-lock'
    - id: dev-modes-quiet-run
      name: 'dsh-dev-modes/quiet-run'
    - id: dev-modes-session-delete
      name: 'dsh-dev-modes/session-delete'
